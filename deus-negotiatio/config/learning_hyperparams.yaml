learning_rate: 5.0e-5         # STABLE: Lower for consistent convergence
gamma: 0.99                   # Long-term planning
tau: 0.005
buffer_size: 200000           # Large buffer for diverse experience
batch_size: 256               # Stable updates
epsilon_start: 1.0
epsilon_end: 0.10             # RAISED: Maintain exploration in complex state space
epsilon_decay: 0.995          # SLOW: ~1000 episodes to reach min (was 0.85)
target_update_interval: 5000  # STABLE: 10x slower syncing (was 500)
gradient_clipping: 5.0        # NEW: Prevent gradient explosions
num_episodes: 200
steps_per_episode: 720        # 3600 sim seconds / 5 second delta_time

network:
  hidden_dims: [256, 128]
  dropout: 0.1
  dueling: true

multi_agent:
  coordination_weight: 0.1
  neighbor_radius: 1

multi_sensor:
  enabled: true
  lidar:
    grid_size: 8
    max_range: 100.0
    noise_stddev: 0.05
  infrared:
    ambient_temp: 20.0
    sensor_range: 50.0
  motion:
    range_m: 60.0
  environment:
    weather_change_prob: 0.001
  observation:
    state_dim: 172

safety_constraints:
  min_pedestrian_walk: 7.0
  min_green_time: 10.0
  max_green_time: 60.0
